
server:
  port: 8081
  error:
    include-message: always

# Configuración de Spring
spring:
  application:
    name: herramientas-matutino

  # Configuración de la base de datos
  datasource:
    url: jdbc:postgresql://localhost:5432/herramientas-matutino
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Configuración de migraciones
  flyway:
    enabled: true
    baseline-version: 1
    locations: classpath:db/migration
    sql-migration-suffixes: .sql
    baseline-on-migrate: true
    sql-migration-prefix: V
    schemas: public

  # Configuración de JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
